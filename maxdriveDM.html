<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>MaxDrive 極限動能</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;700;900&family=Bebas+Neue&family=Barlow:wght=300;400;600;700;800;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 210mm;
      font-family: "Noto Sans TC", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      background: #0f1a10;
    }
    .poster {
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #0f1a10;
      position: relative; /* 讓內部絕對定位的產品區塊以此為基準 */
    }
    
    /* ── HERO ── */
    .hero-section {
      position: relative;
      flex-shrink: 0;
      height: 96mm;
      background: linear-gradient(135deg, #0a1209 0%, #1a3020 40%, #0f2015 100%);
      display: flex;
      overflow: visible;
    }
    .hero-section::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        -55deg, transparent 0px, transparent 18px,
        rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 19px
      );
      z-index: 0;
    }
    /* 斜線橘色裝飾：往左調整避免與右上角圖片衝突 */
    .hero-section::after {
      content: '';
      position: absolute;
      top: -20px; right: 80mm;
      width: 5px; height: 130mm;
      background: linear-gradient(180deg, transparent, #e86629 30%, #e86629 70%, transparent);
      transform: skewX(-10deg);
      opacity: 0.7;
      z-index: 1;
    }
    .hero-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8mm 0 8mm 11mm;
      position: relative;
      z-index: 2;
    }
    .collab-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3mm;
    }
    .collab-dot { width: 9px; height: 9px; border-radius: 50%; background: #e86629; }
    .collab-text {
      font-family: "Barlow", sans-serif;
      font-size: 13px; font-weight: 700;
      color: rgba(232,102,41,0.95);
      letter-spacing: 2px; text-transform: uppercase;
    }
    .hero-en {
      font-family: "Bebas Neue", sans-serif;
      font-size: 104px; color: #ffffff;
      letter-spacing: 5px; line-height: 0.85; display: block;
    }
    .hero-cn {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 30px; font-weight: 300;
      color: #ffffff;
      letter-spacing: 14px; margin-top: 5px; display: block;
    }
    .hero-tagline {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 12px; font-weight: 300;
      color: rgba(255,255,255,0.75);
      line-height: 1.8; margin-top: 4mm;
      padding-left: 12px;
      border-left: 3px solid #e86629;
    }

    /* ── 產品圖：已改為絕對定位，精準鎖定 A4 右上角 ── */
    .hero-right {
      position: absolute;
      top: 10mm; 
      right: 11mm;
      width: 70mm;
      height: 95mm;
      z-index: 10; /* 提高層級，確保壓在橘色帶與所有元素最上方 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .product-glow {
      position: absolute;
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%);
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(58,107,69,0.6) 0%, transparent 70%);
      z-index: 1;
    }
    .product-img {
      width: 220px; height: 220px;
      object-fit: contain;
      position: relative; 
      z-index: 2;
      filter: drop-shadow(0 16px 40px rgba(0,0,0,0.8));
    }

    /* ── ORANGE BAND ── */
    .orange-band {
      background: #e86629;
      flex-shrink: 0;
      padding: 6px 11mm;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 2;
      padding-right: 80mm; /* 右側向內縮，留出空間給右上角懸浮的產品圖 */
      justify-content: space-between;
    }
    .band-item {
      font-family: "Barlow", sans-serif;
      font-size: 12px; font-weight: 800;
      color: white; letter-spacing: 1.5px; text-transform: uppercase;
      white-space: nowrap;
    }
    .band-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.4); flex-shrink:0; }

    /* ── KPI STRIP ── */
    .kpi-strip {
      background: #1a3020;
      flex-shrink: 0;
      display: flex;
      padding: 0 11mm;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative;
      z-index: 1;
    }
    .kpi-item {
      flex: 1;
      padding: 5mm 0 4mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.08);
      gap: 2px;
    }
    .kpi-item:last-child { border-right: none; }
    .kpi-num {
      font-family: "Bebas Neue", sans-serif;
      font-size: 54px; color: #ffffff; line-height: 1;
    }
    .kpi-unit {
      font-family: "Barlow", sans-serif;
      font-size: 17px; font-weight: 700; color: #e86629;
    }
    .kpi-item span[style*="font-size:30px"] {
      font-family: "Barlow", "Noto Sans TC", sans-serif;
      font-weight: 700;
    }
    .kpi-label {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 12px; font-weight: 400;
      color: #ffffff;
      text-align: center; line-height: 1.5; margin-top: 1px;
    }

    /* ── INGREDIENTS ── */
    .ing-section {
      background: #0f1a10;
      flex-shrink: 0;
      padding: 4mm 11mm;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sec-title {
      font-family: "Barlow", sans-serif;
      font-size: 11px; font-weight: 800;
      color: #e86629;
      letter-spacing: 4px; text-transform: uppercase;
      margin-bottom: 3mm;
    }
    .ing-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .ing-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: 3px solid #3a6b45;
      border-radius: 3px;
      padding: 6px 8px;
    }
    .ing-card.o { border-top-color: #e86629; }
    .ing-name {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 13px; font-weight: 700; color: #ffffff;
      display: block; margin-bottom: 2px;
    }
    .ing-role {
      font-family: "Barlow", sans-serif;
      font-size: 10px; font-weight: 400;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.3px;
    }
    .ing-mech {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 10px; font-weight: 300;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
    }

    /* ── CASES ── */
    .cases-section {
      background: #132318;
      flex: 1;
      padding: 4mm 11mm;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .cases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .case-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 5px solid #3a6b45;
      border-radius: 3px;
      padding: 8px 11px;
      display: flex; flex-direction: column; gap: 4px;
      overflow: hidden;
